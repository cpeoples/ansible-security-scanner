name: Refresh CI tooling lockfile

# Dependabot can't run pip-compile, so this regenerates the hash-locked
# constraints.txt from constraints.in on a weekly schedule.

on:
  schedule:
    - cron: "0 11 * * 1"  # Monday 06:00 America/New_York (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: |
          pip_pin=$(grep -m1 -oE '^pip==[0-9][0-9.]*' .github/constraints.txt)
          pip_tools_pin=$(grep -m1 -oE '^pip-tools==[0-9][0-9.]*' .github/constraints.txt)
          pip install --require-hashes -c .github/constraints.txt "$pip_pin" "$pip_tools_pin"

      - name: Recompile lockfile
        run: |
          pip-compile \
            --generate-hashes \
            --strip-extras \
            --allow-unsafe \
            --output-file=.github/constraints.txt \
            .github/constraints.in

      - name: Open PR if lockfile changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "Refresh CI tooling lockfile"
          title: "Refresh CI tooling lockfile"
          body: |
            Weekly regeneration of `.github/constraints.txt` from
            `.github/constraints.in` via `pip-compile`.
          branch: refresh-ci-lockfile
          delete-branch: true
          add-paths: .github/constraints.txt
          sign-commits: true
