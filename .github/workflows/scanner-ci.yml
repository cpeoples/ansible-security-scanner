name: Scanner CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: scanner-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history for version resolution
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable) + test deps
        run: |
          pip_pin=$(grep -m1 -oE '^pip==[0-9][0-9.]*' .github/constraints.txt)
          pip install --require-hashes -c .github/constraints.txt "$pip_pin"
          pip install -e ".[dev]"

      - name: Run scanner unit + regression tests
        run: pytest tests/ -v

  build:
    name: Build distribution (dry run)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: pip install --require-hashes -c .github/constraints.txt build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata with twine
        run: twine check --strict dist/*

      - name: Upload dist artifacts (for inspection)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scanner-dist-preview
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  snap:
    name: Build snap (dry run)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tags so `git describe` can resolve the version
          persist-credentials: false

      - name: Check for snap-relevant changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(snap/|pyproject\.toml|src/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve snap version
        if: steps.changed.outputs.run == 'true'
        run: git describe --tags --abbrev=0 | sed 's/^v//' > snap/.version

      - name: Install LXD
        id: install_lxd
        if: steps.changed.outputs.run == 'true'
        # action-build installs lxd via "snap install", which the store can
        # intermittently refuse. Retry before the build runs. A persistent
        # outage is classified by the report step, so don't fail the job here.
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo snap install lxd; then
              echo "lxd installed on attempt $attempt"
              exit 0
            fi
            echo "snap store unreachable (attempt $attempt), retrying in 30s..."
            sleep 30
          done
          echo "snap store still unreachable after retries"
          exit 1

      - name: Build snap
        id: build
        if: steps.changed.outputs.run == 'true'
        # Don't fail CI on a store outage; the report step classifies the result.
        continue-on-error: true
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0

      - name: Install and smoke-test the snap
        if: steps.changed.outputs.run == 'true' && steps.build.outcome == 'success'
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -euo pipefail
          sudo snap install --dangerous "$SNAP_FILE"
          ansible-security-scanner --version
          # Sideloaded snaps don't auto-connect home like store installs do.
          sudo snap connect ansible-security-scanner:home
          mkdir -p "$HOME/snap-smoke"
          printf -- '- hosts: all\n  tasks:\n    - shell: echo hi\n' > "$HOME/snap-smoke/playbook.yml"
          ansible-security-scanner --directory "$HOME/snap-smoke" || true

      - name: Report snap dry-run outcome
        if: steps.changed.outputs.run == 'true'
        run: |
          set -u
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "snap dry-run build succeeded"
            exit 0
          fi

          # Store outage -> warn and pass. Real build defect -> fail.
          if [ "${{ steps.install_lxd.outcome }}" != "success" ]; then
            echo "::warning title=Snap Store unreachable::lxd install failed; treating as a transient store outage."
            exit 0
          fi

          # lxd installed, so probe the store to tell an outage from a defect.
          store_unreachable=0
          for probe in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://api.snapcraft.io/api/v1/snaps/search?q=core 2>/dev/null || echo 000)
            echo "snap store probe $probe -> http_code=$code"
            case "$code" in
              2??|3??|4??) store_unreachable=0; break ;;
              *)           store_unreachable=1; sleep 10 ;;
            esac
          done
          if [ "$store_unreachable" = "1" ]; then
            echo "::warning title=Snap Store unreachable::build failed and api.snapcraft.io is unreachable; treating as a transient store outage."
            exit 0
          fi

          # The store can blip during the build and recover before the probe
          # runs, so the probe alone misses it. Scan the snapcraft build log for
          # outage signatures and treat those as transient too.
          if grep -rqiE 'api\.snapcraft\.io.*(connection refused|connect: connection)|failed to inject host.s snap|cannot install system snap "snapd"' \
            "$HOME/.local/state/snapcraft/log/" 2>/dev/null; then
            echo "::warning title=Snap Store unreachable::build log shows a store outage during the build; treating as transient."
            exit 0
          fi

          echo "::error title=Snap dry-run build failed::build failed with the store reachable. Check the Build snap logs."
          exit 1
